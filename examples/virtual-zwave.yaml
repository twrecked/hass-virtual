version: 1
devices:
  # ==========================================
  # SMART LOCKS (MULTI-ENTITY DEVICE)
  # ==========================================

  # 1. Front Door Lock (Schlage)
  # Lock entity has name omitted (primary entity), sub-entities use concise names
  Front Door Lock:
    - platform: lock
      initial_value: "locked"
      locking_time: 2             # Schlage motorized bolt transit
      jamming_test: 0
    - platform: sensor
      name: Battery
      class: battery
      unit_of_measurement: "%"
      initial_value: "100"
      battery_life_days: 90       # Discharges over ~3 months
      sim_speed: 1.0              # Can be accelerated with virtual.set_sim_speed
    - platform: binary_sensor
      name: Low Battery
      class: battery
      linked_battery_sensor: "Battery"
      low_battery_threshold: 15

  # ==========================================
  # DOOR CONTACT SENSORS (CLEAN SINGLE-ENTITY DEVICES)
  # ==========================================

  # 2. Front Door Sensor
  Front Door Sensor:
    - platform: binary_sensor
      class: door
      initial_value: "off"

  # 3. Back Door Sensor
  Back Door Sensor:
    - platform: binary_sensor
      class: door
      initial_value: "off"

  # 4. Garage Door Sensor
  Garage Door Sensor:
    - platform: binary_sensor
      class: door
      initial_value: "off"

  # 5. Shed Door Sensor
  Shed Door Sensor:
    - platform: binary_sensor
      class: door
      initial_value: "off"

  # 6. Basement Door Sensor
  Basement Door Sensor:
    - platform: binary_sensor
      class: door
      initial_value: "off"

  # ==========================================
  # IN-WALL LIGHT SWITCHES (CLEAN SINGLE-ENTITY DEVICES)
  # ==========================================

  # 7. Living Room In-Wall Dimmer
  Living Room Dimmer:
    - platform: light
      initial_value: "off"
      support_brightness: true
      initial_brightness: 254
      support_color: false
      support_color_temp: false

  # 8. Kitchen Switch
  Kitchen Light Switch:
    - platform: switch
      initial_value: "off"

  # 9. Sun Room Switch
  Sun Room Light Switch:
    - platform: switch
      initial_value: "off"

  # 10. Entrance Switch
  Entrance Light Switch:
    - platform: switch
      initial_value: "off"

  # 11. Office Switch
  Office Light Switch:
    - platform: switch
      initial_value: "off"

  # 12. Mani's Room Switch
  Manis Room Light Switch:
    - platform: switch
      initial_value: "off"

  # 13. Margo's Room Switch
  Margos Room Light Switch:
    - platform: switch
      initial_value: "off"

  # 14. Master Bedroom Switch
  Master Bedroom Light Switch:
