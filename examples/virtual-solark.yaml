version: 1

simulations:
  - type: solar_inverter
    name: "Sol-Ark Energy Manager"
    battery_strategy: "backup"     # "backup" (holds battery at 100% float for outages) or "self_consumption" (daily cycle)
    peak_solar_power: 11000          # 11 kW peak at noon
    base_load: 250                   # Inverter self-consumption + standby draw (W)
    battery_capacity: 15.0           # 15 kWh pack
    battery_min_soc: 20              # 20% minimum discharge reserve
    battery_max_power: 5000          # 5 kW max charge/discharge rate
    sim_speed: 1.0                   # Simulation acceleration multiplier

    # Linked Sensors in this file:
    pv_power_sensor: "Sol-Ark PV Power"
    pv_energy_sensor: "Sol-Ark PV Energy"
    load_power_sensor: "Sol-Ark Load Power"
    load_energy_sensor: "Sol-Ark Load Energy"
    base_load_power_sensor: "Sol-Ark Base Load Power"
    base_load_energy_sensor: "Sol-Ark Base Load Energy"
    grid_voltage_sensor: "Sol-Ark Grid Voltage"
    grid_power_sensor: "Sol-Ark Grid Power"
    grid_energy_in_sensor: "Sol-Ark Grid Energy In"
    grid_energy_out_sensor: "Sol-Ark Grid Energy Out"
    battery_power_sensor: "Sol-Ark Battery Power"
    battery_soc_sensor: "Sol-Ark Battery SoC"
    battery_voltage_sensor: "Sol-Ark Battery Voltage"
    battery_energy_in_sensor: "Sol-Ark Battery Energy In"
    battery_energy_out_sensor: "Sol-Ark Battery Energy Out"

    # External appliances in your house to sum into the load:
    linked_loads:
      - "sensor.living_room_tv_outlet_power"
      - "sensor.living_room_amplifier_outlet_power"
      - "sensor.utility_chest_freezer_outlet_power"
      - "sensor.washing_machine_outlet_power"
      - "sensor.tumble_dryer_outlet_power"
      - "sensor.utility_water_heater_power"
      - "sensor.main_hvac_power"

devices:
  # Device 1: Inverter & Grid
  Sol-Ark Inverter:
    - platform: sensor
      name: Sol-Ark Grid Voltage
      class: voltage
      unit_of_measurement: "V"
      initial_value: "240.0"

    - platform: sensor
      name: Sol-Ark Grid Power
      class: power
      unit_of_measurement: "W"
      initial_value: "0"

    - platform: sensor
      name: Sol-Ark Grid Energy In
      class: energy
      unit_of_measurement: "kWh"
      initial_value: "100.0"

    - platform: sensor
      name: Sol-Ark Grid Energy Out
      class: energy
      unit_of_measurement: "kWh"
      initial_value: "50.0"

    - platform: sensor
      name: Sol-Ark Load Power
      class: power
      unit_of_measurement: "W"
      initial_value: "250"

    - platform: sensor
      name: Sol-Ark Load Energy
      class: energy
      unit_of_measurement: "kWh"
      initial_value: "250.0"

    - platform: sensor
      name: Sol-Ark Base Load Power
      class: power
      unit_of_measurement: "W"
      initial_value: "250"

    - platform: sensor
      name: Sol-Ark Base Load Energy
      class: energy
      unit_of_measurement: "kWh"
      initial_value: "0.0"

  # Device 2: Solar Panels
  Sol-Ark Solar Array:
    - platform: sensor
      name: Sol-Ark PV Power
      class: power
      unit_of_measurement: "W"
      initial_value: "0"

    - platform: sensor
      name: Sol-Ark PV Energy
      class: energy
      unit_of_measurement: "kWh"
      initial_value: "300.0"

  # Device 3: Battery Storage
  Sol-Ark Battery Storage:
    - platform: sensor
      name: Sol-Ark Battery SoC
      class: battery
      unit_of_measurement: "%"
      initial_value: "85"

    - platform: sensor
      name: Sol-Ark Battery Power
      class: power
      unit_of_measurement: "W"
      initial_value: "0"

    - platform: sensor
      name: Sol-Ark Battery Voltage
      class: voltage
      unit_of_measurement: "V"
      initial_value: "52.4"

    - platform: sensor
      name: Sol-Ark Battery Energy In
      class: energy
      unit_of_measurement: "kWh"
      initial_value: "0.0"

    - platform: sensor
      name: Sol-Ark Battery Energy Out
      class: energy
      unit_of_measurement: "kWh"
      initial_value: "0.0"
