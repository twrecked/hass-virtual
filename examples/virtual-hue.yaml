version: 1
devices:
  # --- White-Only Dimmable Lights (Clean Single-Entity Devices) ---

  # 1. Mani's Bedroom Light
  Manis Bedroom Light:
    - platform: light
      initial_value: "off"
      support_brightness: true
      initial_brightness: 254

  # 2. Margo's Bedroom Light
  Margos Bedroom Light:
    - platform: light
      initial_value: "off"
      support_brightness: true
      initial_brightness: 254

  # 3. Master Closet Light
  Master Closet Light:
    - platform: light
      initial_value: "off"
      support_brightness: true
      initial_brightness: 254

  # --- Multi-Coloured Lights (Color & Color Temp) ---

  # 4. Front Porch Light
  Front Porch Light:
    - platform: light
      initial_value: "off"
      support_brightness: true
      initial_brightness: 254
      support_color: true
      initial_color: [30, 80]       # Warm amber
      support_color_temp: true
      initial_color_temp: 2700      # 2700K Warm White
      support_effect: true
      initial_effect_list:
        - candle
        - fire
        - prism

  # 5. Back Deck Light 1
  Back Deck Light 1:
    - platform: light
      initial_value: "off"
      support_brightness: true
      initial_brightness: 254
      support_color: true
      initial_color: [120, 90]
      support_color_temp: true
      initial_color_temp: 2700
      support_effect: true
      initial_effect_list:
        - candle
        - fire
        - prism

  # 6. Back Deck Light 2
  Back Deck Light 2:
    - platform: light
      initial_value: "off"
      support_brightness: true
      initial_brightness: 254
      support_color: true
      initial_color: [120, 90]
      support_color_temp: true
      initial_color_temp: 2700
      support_effect: true
      initial_effect_list:
        - candle
        - fire
        - prism
