version: 1
devices:
  # Multi-entity showcase device
  Example Devices:
    # 1. Virtual Alarm Control Panel
    - platform: alarm_control_panel
      name: Example Security
      initial_value: disarmed
      code: "1234"
      code_arm_required: false
      arming_time: 10
      trigger_time: 10

    # 2. Virtual Button
    - platform: button
      name: Example Action
      class: restart

    # 3. Virtual Select Dropdown
    - platform: select
      name: Example Mode
      options:
        - Home
        - Away
        - Night
        - Vacation
      initial_value: Home

    # 4. Virtual Text Input
    - platform: text
      name: Example Message
      initial_value: "Testing Tier 1 and Tier 2 devices"
      min: 0
      max: 255
      mode: text

    # 5. Virtual Media Player
    - platform: media_player
      name: Example Speaker
      class: speaker
      initial_value: idle
      initial_volume: 0.5
      source_list:
        - Radio
        - Spotify
        - AirPlay

    # 6. Virtual Camera
    - platform: camera
      name: Example Camera
      initial_value: idle
      image_url: "https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=640"
      stream_url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"

  # 7. Smart Plug with Simulated TV Load
  Living Room TV Outlet:
    - platform: switch
      name: TV Plug
      class: outlet
      initial_value: "on"
    - platform: sensor
      name: TV Power
      class: power
      unit_of_measurement: "W"
      linked_switch: "TV Plug"
      standby_power: 3.5
      active_power: 140.0
      initial_load: "standby"
      variance: 1.5

  # 8. Water Heater with Scheduled Hourly Heating Cycle
  Utility Water Heater:
    - platform: switch
      name: Water Heater Switch
      class: switch
      initial_value: "on"
    - platform: sensor
      name: Water Heater Power
      class: power
      unit_of_measurement: "W"
      linked_switch: "Water Heater Switch"
      standby_power: 0.0
      active_power: 2400.0
      cycle_duration: 600
      cycle_interval: 3600
      cycle_align: "hour"

  # 9. Security Camera with Gated Motion & Sound Detection
  Driveway Security:
    - platform: camera
      name: Driveway Camera
      image_url: "https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=640"
      stream_url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
    - platform: binary_sensor
      name: Driveway Motion
      class: motion
      off_delay: 10
      linked_entity: "Driveway Camera"
    - platform: binary_sensor
      name: Driveway Sound
      class: sound
      off_delay: 5
      linked_entity: "Driveway Camera"
