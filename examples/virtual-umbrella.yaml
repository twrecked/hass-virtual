version: 1
devices:
  Test Umbrella:
    # 1. Virtual Thermostat / Climate
    - platform: climate
      name: Umbrella Thermostat
      initial_value: heat
      initial_temperature: 21
      initial_current_temperature: 19.5
      min_temp: 10
      max_temp: 32
      target_temperature_step: 0.5
      hvac_modes:
        - 'off'
        - heat
        - cool
        - auto
      preset_modes:
        - none
        - eco
        - comfort
        - away

    # 2. Virtual Alarm Control Panel
    - platform: alarm_control_panel
      name: Umbrella Security
      initial_value: disarmed
      code: "1234"
      code_arm_required: false
      arming_time: 10
      trigger_time: 10

    # 3. Virtual Button
    - platform: button
      name: Umbrella Action
      class: restart

    # 4. Virtual Select Dropdown
    - platform: select
      name: Umbrella Mode
      options:
        - Home
        - Away
        - Night
        - Vacation
      initial_value: Home

    # 5. Virtual Text Input
    - platform: text
      name: Umbrella Message
      initial_value: "Testing Tier 1 and Tier 2 devices"
      min: 0
      max: 255
      mode: text

    # 6. Virtual Media Player
    - platform: media_player
      name: Umbrella Speaker
      class: speaker
      initial_value: idle
      initial_volume: 0.5
      source_list:
        - Radio
        - Spotify
        - AirPlay

    # 7. Virtual Camera
    - platform: camera
      name: Umbrella Camera
      initial_value: idle
      image_url: "https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=640"
      stream_url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"

  # 8. Smart Plug with Simulated TV Load
  Living Room TV Outlet:
    - platform: switch
      name: TV Plug
      class: outlet
      initial_value: "on"
    - platform: sensor
      name: TV Power
      class: power
      unit_of_measurement: "W"
      linked_switch: "TV Plug"
      standby_power: 3.5
      active_power: 140.0
      initial_load: "standby"
      variance: 1.5

  # 9. Water Heater with Scheduled Hourly Heating Cycle
  Utility Water Heater:
    - platform: switch
      name: Water Heater Switch
      class: switch
      initial_value: "on"
    - platform: sensor
      name: Water Heater Power
      class: power
      unit_of_measurement: "W"
      linked_switch: "Water Heater Switch"
      standby_power: 0.0
      active_power: 2400.0
      cycle_duration: 600
      cycle_interval: 3600
      cycle_align: "hour"

  # 10. Security Camera with Gated Motion & Sound Detection
  Driveway Security:
    - platform: camera
      name: Driveway Camera
      image_url: "https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=640"
      stream_url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
    - platform: binary_sensor
      name: Driveway Motion
      class: motion
      off_delay: 10
      linked_entity: "Driveway Camera"
    - platform: binary_sensor
      name: Driveway Sound
      class: sound
      off_delay: 5
      linked_entity: "Driveway Camera"

  # 11. Closed-Loop Thermal HVAC with Ambient Weather Sync
  Main House HVAC:
    - platform: climate
      name: Main House Thermostat
      initial_value: "heat"
      initial_temperature: 21.0
      initial_current_temperature: 20.0
      indoor_sensor: "Main Indoor Temp"
      outdoor_sensor: "Main Outdoor Temp"
      power_sensor: "Main HVAC Power"
      sim_speed: 1.0
      house_leakage_rate: 0.3
    - platform: sensor
      name: Main Indoor Temp
      class: temperature
      unit_of_measurement: "°C"
      initial_value: "20.0"
    - platform: sensor
      name: Main Outdoor Temp
      class: temperature
      unit_of_measurement: "°C"
      initial_value: "4.0"
    - platform: sensor
      name: Main HVAC Power
      class: power
      unit_of_measurement: "W"
      initial_value: "1800"
