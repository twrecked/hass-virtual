version: 1
devices:
  # 1. Living Room Television
  Living Room TV Outlet:
    - platform: switch
      class: outlet
      initial_value: "on"
    - platform: sensor
      name: Power
      class: power
      unit_of_measurement: "W"
      linked_switch: "Living Room TV Outlet"
      standby_power: 2.5
      active_power: 135.0
      initial_load: "standby"
      variance: 2.0
    - platform: sensor
      name: Energy
      class: energy
      unit_of_measurement: "kWh"
      linked_power: "Power"
      initial_value: "0.0"

  # 2. Audio Amplifier
  Living Room Amplifier Outlet:
    - platform: switch
      class: outlet
      initial_value: "on"
    - platform: sensor
      name: Power
      class: power
      unit_of_measurement: "W"
      linked_switch: "Living Room Amplifier Outlet"
      standby_power: 1.5
      active_power: 65.0
      initial_load: "standby"
      variance: 3.5
    - platform: sensor
      name: Energy
      class: energy
      unit_of_measurement: "kWh"
      linked_power: "Power"
      initial_value: "0.0"

  # 3. Chest Freezer (Recurring Compressor Cycle)
  Utility Chest Freezer Outlet:
    - platform: switch
      class: outlet
      initial_value: "on"
    - platform: sensor
      name: Power
      class: power
      unit_of_measurement: "W"
      linked_switch: "Utility Chest Freezer Outlet"
      standby_power: 0.8
      active_power: 85.0
      cycle_duration: 900        # 15 min compressor run
      cycle_interval: 2700       # Every 45 min
      cycle_align: "interval"
      variance: 1.0
    - platform: sensor
      name: Energy
      class: energy
      unit_of_measurement: "kWh"
      linked_power: "Power"
      initial_value: "0.0"

  # 4. Washing Machine
  Washing Machine Outlet:
    - platform: switch
      class: outlet
      initial_value: "on"
    - platform: sensor
      name: Power
      class: power
      unit_of_measurement: "W"
      linked_switch: "Washing Machine Outlet"
      standby_power: 2.0
      active_power: 380.0
      cycle_duration: 2700       # Default 45 min wash cycle
      initial_load: "standby"
      variance: 5.0
    - platform: sensor
      name: Energy
      class: energy
      unit_of_measurement: "kWh"
      linked_power: "Power"
      initial_value: "0.0"

  # 5. Heat Pump Tumble Dryer
  Tumble Dryer Outlet:
    - platform: switch
      class: outlet
      initial_value: "on"
    - platform: sensor
      name: Power
      class: power
      unit_of_measurement: "W"
      linked_switch: "Tumble Dryer Outlet"
      standby_power: 1.0
      active_power: 650.0
      cycle_duration: 3600       # Default 60 min dry cycle
      initial_load: "standby"
      variance: 8.0
    - platform: sensor
      name: Energy
      class: energy
      unit_of_measurement: "kWh"
      linked_power: "Power"
      initial_value: "0.0"

  # 6. Master Bedroom Fan & Light (Sonoff iFan)
  Master Bedroom Ceiling Fan:
    - platform: fan
      speed_count: 3              # 3 speeds: Low (33%), Medium (67%), High (100%)
      initial_value: "off"
    - platform: light
      name: Light
      initial_value: "off"
      support_brightness: false   # Simple on/off light

  # 7. Water Heater (Scheduled Hourly Heating Cycle)
  Utility Water Heater:
    - platform: switch
      class: switch
      initial_value: "on"
    - platform: sensor
      name: Power
      class: power
      unit_of_measurement: "W"
      linked_switch: "Utility Water Heater"
      standby_power: 0.0
      active_power: 2400.0
      cycle_duration: 600        # 10 minutes active
      cycle_interval: 3600       # Repeats every 1 hour
      cycle_align: "hour"        # Aligned to :00 on the clock
    - platform: sensor
      name: Energy
      class: energy
      unit_of_measurement: "kWh"
      linked_power: "Power"
      initial_value: "0.0"
