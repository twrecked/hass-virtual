# Describes the format for available virtual services

turn_on:
  name: Turn On
  description: Turn on a binary sensor, with optional auto-off duration in seconds.
  target:
    entity:
      integration: virtual
      domain: binary_sensor
  fields:
    duration:
      name: Duration
      description: Optional duration in seconds before automatically resetting back to off.
      example: 10
      required: false
      selector:
        number:
          min: 1
          mode: box
          unit_of_measurement: "s"

turn_off:
  name: Turn Off
  description: Turn off a binary sensor.
  target:
    entity:
      integration: virtual
      domain: binary_sensor

toggle:
  name: Toggle
  description: Toggle a binary sensor.
  target:
    entity:
      integration: virtual
      domain: binary_sensor

set:
  name: Set
  description: Set the value of a sensor.
  target:
    entity:
      integration: virtual
      domain: sensor
  fields:
    value:
      name: Value
      description: Value to set state to.
      required: true
      example: '10'
      selector:
        text:

set_available:
  name: Set Availability
  description: Set availability of an entity.
  target:
    entity:
      integration: virtual
  fields:
    value:
      name: Value
      description: Is the entity available.
      example: false
      required: true
      selector:
        boolean:

move:
  name: Move
  description: Move a device tracker to a new location.
  target:
    entity:
      integration: virtual
      domain: device_tracker
  fields:
    location:
      name: Named Location
      description: Where to move the device tracker to.
      example: 'home'
      selector:
        text:
    gps:
      name: GPS Location
      description: Which coordinates to move the device tracker to.
      example: '{"latitude": -27.9699373, "longitude": 153.4081865}'
      selector:
        location:
          radius: false
    gps_accuracy:
      selector:
        number:
          min: 0
          mode: box
          unit_of_measurement: "m"

set_current_temperature:
  name: Set Current Temperature
  description: Set the ambient current temperature of a virtual climate entity.
  target:
    entity:
      integration: virtual
      domain: climate
  fields:
    temperature:
      name: Temperature
      description: The current ambient temperature to set.
      example: 19.5
      required: true
      selector:
        number:
          step: 0.1
          mode: box

set_image_url:
  name: Set Image URL
  description: Set the still image URL or local path for a virtual camera.
  target:
    entity:
      integration: virtual
      domain: camera
  fields:
    image_url:
      name: Image URL
      description: URL or local file path to the camera snapshot image.
      example: "https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=640"
      required: true
      selector:
        text:

set_stream_url:
  name: Set Stream URL
  description: Set the live stream URL for a virtual camera.
  target:
    entity:
      integration: virtual
      domain: camera
  fields:
    stream_url:
      name: Stream URL
      description: HLS, RTSP, or HTTP stream URL for the camera. Set to empty or "none" to disable live streaming.
      example: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
      required: true
      selector:
        text:

set_load:
  name: Set Simulated Load
  description: Set the load state or power consumption of a simulated appliance power sensor.
  target:
    entity:
      integration: virtual
      domain: sensor
  fields:
    state:
      name: Load State
      description: Appliance operating state ("active", "standby", "off", or "auto" to resume schedule).
      example: "active"
      required: true
      selector:
        select:
          options:
            - "active"
            - "standby"
            - "off"
            - "auto"
    power:
      name: Power
      description: Optional wattage override to set when in active state.
      example: 2400
      required: false
      selector:
        number:
          min: 0
          mode: box
          unit_of_measurement: "W"

run_cycle:
  name: Run Load Cycle
  description: Trigger an active appliance run cycle for a specified duration, after which it automatically reverts to standby or scheduled mode.
  target:
    entity:
      integration: virtual
      domain: sensor
  fields:
    duration:
      name: Duration
      description: Run duration in seconds.
      example: 60
      required: false
      selector:
        number:
          min: 1
          mode: box
          unit_of_measurement: "s"

set_sim_speed:
  name: Set Simulation Speed
  description: Adjust the simulation speed multiplier for a virtual climate entity with thermal modeling.
  target:
    entity:
      integration: virtual
      domain: climate
  fields:
    speed:
      name: Speed Multiplier
      description: Simulation acceleration multiplier (e.g. 1.0 for real-time, 10.0 for 10x speed).
      example: 10.0
      required: true
      selector:
        number:
          min: 0.1
          max: 1000
          step: 0.5
          mode: box

set_light:
  name: Set Light
  description: Set brightness, color, color temperature, or effect of a virtual light without changing its on/off power state (attribution @Perlmint).
  target:
    entity:
      integration: virtual
      domain: light
  fields:
    brightness:
      name: Brightness
      description: Target brightness level (0-255).
      example: 128
      required: false
      selector:
        number:
          min: 0
          max: 255
          mode: slider
    hs_color:
      name: Hue / Saturation Color
      description: Color as [hue (0-360), saturation (0-100)].
      example: "[120, 100]"
      required: false
      selector:
        text:
    color_temp_kelvin:
      name: Color Temperature (Kelvin)
      description: Color temperature in Kelvin (2000-6535).
      example: 3500
      required: false
      selector:
        number:
          min: 2000
          max: 6535
          mode: slider
          unit_of_measurement: "K"
    effect:
      name: Effect
      description: Light effect name.
      example: "rainbow"
      required: false
      selector:
        text:
