# Describes the format for available virtual services

turn_on:
  name: Turn On
  description: Turn on a binary sensor.
  target:
    entity:
      integration: virtual
      domain: binary_sensor

turn_off:
  name: Turn Off
  description: Turn off a binary sensor.
  target:
    entity:
      integration: virtual
      domain: binary_sensor

toggle:
  name: Toggle
  description: Toggle a binary sensor.
  target:
    entity:
      integration: virtual
      domain: binary_sensor

set:
  name: Set
  description: Set the value of a sensor.
  target:
    entity:
      integration: virtual
      domain: sensor
  fields:
    value:
      name: Value
      description: Value to set state to.
      required: true
      example: '10'
      selector:
        text:

set_available:
  name: Set Availability
  description: Set availability of an entity.
  target:
    entity:
      integration: virtual
  fields:
    value:
      name: Value
      description: Is the entity available.
      example: false
      required: true
      selector:
        boolean:

set_light:
  name: Set light
  description: Set brightness, color, or color temperature of a light without turning it on.
  target:
    entity:
      integration: virtual
      domain: light
  fields:
    brightness:
      name: Brightness
      description: Brightness level (0-255).
      required: false
      example: '128'
      selector:
        text:
    hs_color:
      name: Hue/Saturation color
      description: Color as [hue (0-360), saturation (0-100)].
      required: false
      example: '[120, 100]'
      selector:
        text:
    color_temp_kelvin:
      name: Color temperature in kelvin
      description: Color temperature in kelvin (2000-6535).
      required: false
      example: '4000'
      selector:
        text:

move:
  name: Move
  description: Move a device tracker to a new location.
  target:
    entity:
      integration: virtual
      domain: device_tracker
  fields:
    location:
      name: Named Location
      description: Where to move the device tracker to.
      example: 'home'
      selector:
        text:
    gps:
      name: GPS Location
      description: Which coordinates to move the device tracker to.
      example: '{"latitude": -27.9699373, "longitude": 153.4081865}'
      selector:
        location:
          radius: false
    gps_accuracy:
      selector:
        number:
          min: 0
          mode: box
          unit_of_measurement: "m"
